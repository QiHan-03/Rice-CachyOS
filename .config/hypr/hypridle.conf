general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid launching multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # ensure display wakes properly
}

listener {
    timeout = 300
    on-timeout = brightnessctl -s set 20          # dim screen
    on-resume = brightnessctl -r                  # restore brightness
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'     # screen off
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 1200
    on-timeout = loginctl lock-session            # lock
}

listener {
    timeout = 2400
    on-timeout = systemctl suspend               # sleep
}